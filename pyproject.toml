[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphing"
version = "0.1.0"
description = "Plot and analyse experimental and theoretical UV-Vis and IR spectra."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "PySide6",
    "matplotlib",
    "numpy",
    "scipy",
    "openpyxl",
    "odfpy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff", "mypy"]
structure = ["rdkit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local_data: needs unpublished files in tests/reference/ (skipped when absent)",
    "gui: needs the Qt widgets (offscreen platform)",
    "integration: chains through core/ and render/ without a GUI",
    "corpus: runs the public test corpus in tests/corpus/",
    "e2e: scripted user journeys through the real interface",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"

# Strict typing is required in core/ only (CLAUDE.md section 7 and T0.2).
[[tool.mypy.overrides]]
module = ["graphing.core", "graphing.core.*"]
strict = true
